nameOverride: ""
fullnameOverride: ""

replicaCount: 5

image:
  repository: quay.io/hmpps/prisoner-content-hub-backend
  pullPolicy: IfNotPresent
  tag: latest

tier: backend

application:
  port: 8080
  liveness:
    endpoint: /healthcheck/
    delaySeconds: 10
    timeoutSeconds: 10
  readiness:
    endpoint: /healthcheck/
    delaySeconds: 10
    timeoutSeconds: 5
  config:
    phpMemoryLimit: 256M
    phpUploadMaxFileSize: 2M
    phpPostMaxSize: 8M
    xDebugIp: 127.0.0.1
  dbSecretName: drupal-rds
  s3:
    secretName: drupal-s3-2
    region: eu-west-2
    cname: ''
    cnameIsBucket: true
  redisSecretName: drupal-redis
  govUkSecretName: govuknotify
  openSearchSecretName: pfs-opensearch-proxy-url
  rdsCertificate: /etc/ssl/certs/root.crt

volumes:
  - name: apache-cache
    emptyDir: {}

imagePullSecrets: [] # Are we using ECR?

podSecurityContext:
  fsGroup: 33

securityContext:
  # TODO: add back in but retain CHOWN, UID and GID capabilities
  # capabilities:
  #   drop:
  #   - ALL
  runAsNonRoot: true
  runAsUser: 33
  runAsGroup: 33

resources: {}

affinity: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  tlsEnabled: true
  path: "/"
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/server-snippet: |
       add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive";
    nginx.ingress.kubernetes.io/proxy-body-size: 500m
    nginx.ingress.kubernetes.io/configuration-snippet: |
      server_tokens off;
      location /jsonapi {
        deny all;
        return 401;
      }
      location /en/jsonapi {
        deny all;
        return 401;
      }
      location /cy/jsonapi {
        deny all;
        return 401;
      }

  modsecurity_enabled: true
  modsecurity_github_team: "hmpps-launchpad-devs"
  modsecurity_snippet: |
    SecAuditEngine On
    SecRuleEngine On
    # grant GitHub Team OpenSearch logs to delve into the cause of the blockage
    SecDefaultAction "phase:2,pass,log,tag:github_team=hmpps-launchpad-devs,tag:namespace={{ .Release.Namespace }}"
    SecDefaultAction "phase:4,pass,log,tag:github_team=hmpps-launchpad-devs,tag:namespace={{ .Release.Namespace }}"
    # Change default denial to be a 406 so that we can tell easily that it is modsecurity doing the blocking
    SecRuleUpdateActionById 949110 "t:none,deny,status:406,logdata:%{SERVER_NAME}"
    SecRuleUpdateActionById 959100 "t:none,deny,status:406,logdata:%{SERVER_NAME}"

  jsonapi:
    annotations:
      nginx.ingress.kubernetes.io/server-snippet: |
        add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive";
      nginx.ingress.kubernetes.io/proxy-body-size: 500m
      external-dns.alpha.kubernetes.io/aws-weight: "100"

cron:
  cacheRebuild:
    schedule: "1 3 * * *"
  drupal:
    schedule: "0 */2 * * *"
  scheduler:
    schedule:  "*/5 * * * *"

dbBackup:
  enabled: false
  s3:
    region: eu-west-2
dbRefresh:
  enabled: false

s3Sync:
  enabled: false
  source_region: eu-west-2

generic-prometheus-alerts:
  targetApplication: prisoner-content-hub-backend
